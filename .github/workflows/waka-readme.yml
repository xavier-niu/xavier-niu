name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # runs at 12 AM UTC (5:30 AM IST)
    - cron: "0 */1 * * *"

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update README with WakaTime stats
        uses: athul/waka-readme@master
        with:
          # The action retains this input name for OAuth tokens. See .github/WAKATIME.md.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
